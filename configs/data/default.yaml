# @package _global_
defaults:
  - _self_
  - splitter: random

_target_: acp_learn.data.acp_datamodule.ACPDataModule

# Paths
data_dir: ${paths.data_dir}
train_fasta: ${paths.data_dir}/train.fasta
# Optional: fixed test set (e.g. acp-240). If set, splitter uses this as test.
test_fasta: null

# iFeature: which descriptor types to use (order = join order in merged features)
feature_types: [CTDC, CKSAAGP, CTDD]
ifeature_python: null  # null = use sys.executable
ifeature_script: ${paths.ifeature_dir}/iFeature.py

# Precomputed features: if this file exists, skip iFeature and load it
# Set to null to always compute from FASTA
features_cache: null
# When null, cache is written to data_dir/processed/features_<types>.csv

# Label rules: how to infer label from sequence ID in FASTA
# positive_pattern: if in id -> label 1 (e.g. "seq", "ACP")
# negative_pattern: if in id -> label 0 (e.g. "TRNEGATIVE", "non")
label_positive_pattern: "seq"
label_negative_pattern: "TRNEGATIVE"

# DataLoader
batch_size: 64
num_workers: 0
pin_memory: False

# Imbalance: none | class_weight | oversample | undersample | weighted_sampler
imbalance: class_weight

# Scaling: standardize | minmax | none
scaler: standardize
